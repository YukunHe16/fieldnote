name: 功能建议 / Feature request
description: 提出一个新功能或改进 / Suggest a feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议！中文或英文都可以 / Chinese or English are both fine.

        提之前建议先看一眼 [docs/FEATURES.md](https://github.com/YukunHe16/fieldnote/blob/HEAD/docs/FEATURES.md) 的“明确的非目标与限制”一节——有些方向是项目有意不做的。

  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题 / What problem does this solve?
      description: 请描述实际场景，而不是直接描述实现方案。
      placeholder: "我在复习某个知识点时，需要…… 但现在只能……"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的做法 / Proposed solution
      description: 你希望 Fieldnote 怎么表现？
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 涉及模块 / Area
      multiple: true
      options:
        - 对话式学习模式 / Learning mode
        - 记忆与自进化 / Memory & self-evolution
        - 飞书渠道 / Feishu channel
        - 文件、工作区与导出 / Files, workspaces & export
        - Web 界面 / Web UI
        - 安装与配置 / Install & configuration
        - 文档 / Documentation
        - 其他 / Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案 / Alternatives considered
      description: 现在有没有绕过的办法？为什么不够用？
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 补充信息 / Additional context
      description: 截图、草图、相关链接都可以。请不要附带真实的敏感个人材料。
    validations:
      required: false
