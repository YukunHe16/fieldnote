name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-npm:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect npm token
        id: npm-token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "NPM_TOKEN secret is not configured; skipping npm publish." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Setup pnpm
        if: steps.npm-token.outputs.present == 'true'
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        if: steps.npm-token.outputs.present == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        if: steps.npm-token.outputs.present == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build
        if: steps.npm-token.outputs.present == 'true'
        run: pnpm build

      - name: Audit package contents
        if: steps.npm-token.outputs.present == 'true'
        run: pnpm audit:package

      - name: Publish fieldnote to npm
        if: steps.npm-token.outputs.present == 'true'
        working-directory: packages/fieldnote
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm publish --access public --no-git-checks
